name: MongoDB Differential

on:
  workflow_call:
    inputs:
      case_filter:
        required: false
        type: string
      distribution_artifact:
        description: Immutable wheel artifact produced by the release build
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      case_filter:
        description: Optional comma-separated case glob
        required: false
        type: string
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  differential:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'mongodb-differential')
    name: MongoDB ${{ matrix.target }} differential
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "7.0"
            image: mongo:7.0.43-jammy@sha256:f71f6d0913c945096cd058557cbadf4ad435007f378d84b3c4c636c928735e72
          - target: "8.0"
            image: mongo:8.0.32-noble@sha256:0393ab544cbbe92b2dd64719205ecb14a8b3824b17ea75051e2f22482c3e4e66
          - target: "9.0"
            image: mongo:9.0.2-noble@sha256:61dd87ff554dc20386c63ebe1f7ede27314370ad5a7bf357c685fab424672158
    services:
      mongodb:
        image: ${{ matrix.image }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGOECO_REAL_MONGODB_URI: mongodb://localhost:27017
      MONGOECO_REAL_MONGODB_TARGET: ${{ matrix.target }}
      MONGOECO_DIFFERENTIAL_SEED: "42"
      MONGOECO_TEST_INSTALLED_ARTIFACT: ${{ inputs.distribution_artifact != '' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install differential dependencies
        if: inputs.distribution_artifact == ''
        run: |
          python -m pip install -c requirements/ci-constraints.txt ".[mongodb-real]" unittest-xml-reporting pytest hypothesis

      - name: Download immutable release distributions
        if: inputs.distribution_artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.distribution_artifact }}
          path: dist

      - name: Download distribution manifest
        if: inputs.distribution_artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distribution-manifest
          path: artifact-manifest

      - name: Verify and install the release wheel
        if: inputs.distribution_artifact != ''
        run: |
          sha256sum -c artifact-manifest/SHA256SUMS
          WHEEL="$(find dist -name 'mongoeco-*.whl' -print -quit)"
          python -m pip install -c requirements/ci-constraints.txt "${WHEEL}[mongodb-real]" unittest-xml-reporting pytest hypothesis
          python - <<'PY'
          from pathlib import Path
          import mongoeco
          assert 'site-packages' in Path(mongoeco.__file__).resolve().parts, mongoeco.__file__
          PY

      - name: Establish and verify the requested FCV
        run: |
          python - <<'PY'
          import os
          from pymongo import MongoClient
          target = os.environ["MONGOECO_REAL_MONGODB_TARGET"]
          with MongoClient(os.environ["MONGOECO_REAL_MONGODB_URI"]) as client:
              assert client.server_info()["versionArray"][:2] == [int(x) for x in target.split(".")]
              client.admin.command({"setFeatureCompatibilityVersion": target, "confirm": True})
              assert client.admin.command({"getParameter": 1, "featureCompatibilityVersion": 1})["featureCompatibilityVersion"] == {"version": target}
          PY

      - name: Run reproducible differential suite
        shell: bash
        env:
          CASE_FILTER: ${{ inputs.case_filter }}
        run: |
          mkdir -p "artifacts/${{ matrix.target }}/junit"
          args=("${{ matrix.target }}")
          if [ -n "$CASE_FILTER" ]; then
            args+=("$CASE_FILTER")
          fi
          timeout 20m python scripts/run_mongodb_real_differential.py \
            "${args[@]}" \
            --seed "$MONGOECO_DIFFERENTIAL_SEED" \
            --json-report "artifacts/${{ matrix.target }}/report.json" \
            --junit-dir "artifacts/${{ matrix.target }}/junit" \
              2>&1 | tee "artifacts/${{ matrix.target }}/run.log"

      - name: Verify positional update error codes and document atomicity
        shell: bash
        run: |
          python -m unittest tests.differential.test_positional_update_parity -v \
            2>&1 | tee "artifacts/${{ matrix.target }}/positional-updates.log"

      - name: Verify unacknowledged writes and physical connection reuse
        shell: bash
        run: |
          TARGET_SUFFIX="${MONGOECO_REAL_MONGODB_TARGET//./_}"
          python scripts/capture_unacknowledged_parity.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --output "artifacts/${{ matrix.target }}/unacknowledged.json" \
            --check "tests/fixtures/unacknowledged_mongodb_${TARGET_SUFFIX}.json"
          python -m pytest tests/integration/wire/test_unacknowledged.py \
            tests/integration/api/test_write_preflight_parity.py -q \
            2>&1 | tee "artifacts/${{ matrix.target }}/unacknowledged.log"

      - name: Verify ordinary and mirrored read reply suppression
        shell: bash
        run: |
          TARGET_SUFFIX="${MONGOECO_REAL_MONGODB_TARGET//./_}"
          python scripts/capture_wire_read_parity.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --output "artifacts/${{ matrix.target }}/wire-reads.json" \
            --check "tests/fixtures/wire_reads_mongodb_${TARGET_SUFFIX}.json"
          python -m pytest tests/integration/wire/test_read_reply_parity.py -q \
            2>&1 | tee "artifacts/${{ matrix.target }}/wire-reads.log"
          python scripts/capture_wire_read_parity.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" --corpus envelopes \
            --output "artifacts/${{ matrix.target }}/wire-envelopes.json" \
            --check "tests/fixtures/wire_envelopes_mongodb_${TARGET_SUFFIX}.json"
          python -m pytest tests/integration/wire/test_envelope_parity.py -q \
            2>&1 | tee "artifacts/${{ matrix.target }}/wire-envelopes.log"

      - name: Admit the complete write corpus and public routes
        shell: bash
        env:
          MONGOECO_WRITE_HISTORY_OUTPUT: artifacts/${{ matrix.target }}/write-histories
        run: |
          python scripts/capture_write_parity.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --output-dir "artifacts/${{ matrix.target }}/write-capture" \
            --histories-dir "artifacts/${{ matrix.target }}/write-histories" \
            --check-dir tests/fixtures
          TARGET_SUFFIX="${MONGOECO_REAL_MONGODB_TARGET//./_}"
          python scripts/capture_api_option_parity.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --output "artifacts/${{ matrix.target }}/api-options.json" \
            --check "tests/fixtures/api_options_mongodb_${TARGET_SUFFIX}.json"
          python scripts/capture_error_phases.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --output "artifacts/${{ matrix.target }}/error-phases.json" \
            --check "tests/fixtures/error_phases_mongodb_${TARGET_SUFFIX}.json"
          python -m pytest -q \
            tests/integration/api/test_write_parity_corpus.py \
            tests/integration/api/test_write_identity_parity.py \
            tests/integration/api/test_write_query_parity.py \
            tests/integration/api/test_numeric_identity_conservation.py \
            tests/integration/api/test_id_conversion_conservation.py \
            tests/unit/core/test_id_bson_conversion.py \
            tests/integration/api/test_null_identity_conservation.py \
            tests/integration/api/test_write_operation_parity.py \
            tests/integration/api/test_find_modify_errors.py \
            tests/integration/api/test_shared_error_parity.py \
            tests/integration/api/test_error_phases.py \
            tests/integration/api/test_server_command_inputs.py \
            tests/integration/api/test_code_index_legacy.py \
            tests/unit/core/test_collation_diagnostics.py \
            tests/unit/core/test_shared_error_documents.py \
            tests/integration/api/test_write_operation_conservation.py \
            tests/integration/api/test_api_option_parity.py \
            tests/integration/api/test_api_option_conservation.py \
            tests/integration/api/test_write_histories.py \
            tests/integration/api/test_write_command_parity.py \
            tests/integration/api/test_insert_many_write_contract.py \
            tests/unit/test_write_observer.py \
            tests/unit/test_write_corpus_inventory.py \
            2>&1 | tee "artifacts/${{ matrix.target }}/write-parity.log"

      - name: Verify review expectations against the native server
        run: |
          TARGET_SUFFIX="${MONGOECO_REAL_MONGODB_TARGET//./_}"
          python scripts/capture_differential_replay_golden.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --case-set review-improvements \
            --output "artifacts/${{ matrix.target }}/review-capture.json" \
            --check "tests/fixtures/mongodb_review_improvements_${TARGET_SUFFIX}.json"
          for CASE_SET in version-deltas semantic-guarantees index-guarantees; do
            FIXTURE_SET="${CASE_SET//-/_}"
            python scripts/capture_differential_replay_golden.py \
              --target "$MONGOECO_REAL_MONGODB_TARGET" \
              --case-set "$CASE_SET" \
              --output "artifacts/${{ matrix.target }}/${CASE_SET}-capture.json" \
              --check "tests/fixtures/mongodb_${FIXTURE_SET}_${TARGET_SUFFIX}.json"
          done

      - name: Verify native error payload deltas with the minimum SDK
        run: |
          python -m pip install --target artifacts/native-sdk49 "pymongo==4.9.2"
          TARGET_SUFFIX="${MONGOECO_REAL_MONGODB_TARGET//./_}"
          PYTHONPATH="$PWD/artifacts/native-sdk49" python scripts/capture_error_phases.py \
            --target "$MONGOECO_REAL_MONGODB_TARGET" \
            --output "artifacts/${{ matrix.target }}/error-phases-sdk49.json" \
            --baseline "tests/fixtures/error_phases_mongodb_${TARGET_SUFFIX}.json" \
            --check tests/fixtures/error_phases_pymongo49_deltas.json

      - name: Record exact MongoDB runtime
        if: always()
        run: |
          docker exec "${{ job.services.mongodb.id }}" mongosh --quiet \
            --eval 'EJSON.stringify(db.adminCommand({buildInfo: 1}), null, 2)' \
            > "artifacts/${{ matrix.target }}/mongodb-build-info.json"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongodb-${{ matrix.target }}-differential
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
